services:
  redis:
    image: redis:alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:alpine
    container_name: gateway-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./migrations/001_create_endpoints_table.sql:/docker-entrypoint-initdb.d/001_init.sql
    restart: unless-stopped

volumes:
  pgdata:
